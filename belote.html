$("bMenu").onclick = async function () { var a = await modal("<h2>Pause</h2><button class='btn' data-r='go'>Reprendre</button><button class='btn sec' data-r='rules'>📖 Règles</button><button class='btn sec' data-r='quit'>Abandonner la partie</button>"); if (a === "rules") { await modal(RULES + "<button class='btn' data-r='ok'>Fermer</button>"); } else if (a === "quit") { location.reload(); } };
$("bLast").onclick = function () { if (!g || !g.last) { say("Pas encore de pli à revoir"); return; } var l = g.last, h = "<h2>Dernier pli</h2><div class='tr'>"; l.trick.forEach(function (x) { h += "<div style='text-align:center;font-size:11px'><div id='lp" + x.p + "'></div>" + NAMES[x.p] + (x.p === l.w ? " 🏅" : "") + "</div>"; }); h += "</div><p style='text-align:center'>" + NAMES[l.w] + " remporte " + l.pts + " points</p><button class='btn' data-r='ok'>Fermer</button>"; modal(h); l.trick.forEach(function (x) { var e = cardEl(x.c); e.style.position = "relative"; $("lp" + x.p).appendChild(e); $("lp" + x.p).style.height = "82px"; }); };
$("mRules").onclick = function () { modal(RULES + "<button class='btn' data-r='ok'>Fermer</button>"); };
var RULES = "<h2>Règles</h2><p><b>But :</b> avec ton partenaire (Nord), marque plus de points que l'équipe adverse. Un jeu de 32 cartes, 8 plis par donne, 162 points au total (dont 10 de « dix de der » pour le dernier pli).</p><p><b>Valeur des cartes :</b><br>Atout : Valet 20 · 9 14 · As 11 · 10 10 · Roi 4 · Dame 3.<br>Autres couleurs : As 11 · 10 10 · Roi 4 · Dame 3 · Valet 2.<br>(8 et 7 : 0 point.) L'ordre de force est le même, sauf à l'atout : V, 9, A, 10, R, D, 8, 7.</p><p><b>Jouer :</b> il faut fournir la couleur demandée. Sinon, tu dois couper à l'atout (et surcouper si tu peux), sauf si ton partenaire est maître du pli. Si l'atout est demandé, monte à l'atout si tu peux.</p><p><b>Belote-rebelote :</b> Roi + Dame d'atout dans la même main = +20 points quand tu joues la 2ᵉ carte.</p><p><b>Belote classique :</b> une carte est retournée. Au 1ᵉʳ tour on peut « prendre » à cette couleur ; au 2ᵉ tour, on choisit une autre couleur. Le preneur doit faire au moins 82 points, sinon il est « dedans » : les adversaires marquent 162.</p><p><b>Coinche :</b> chacun annonce un contrat (80 à 160, Capot = tous les plis, Générale = tous les plis seul) avec la couleur d'atout. Le plus haut contrat joue. Les adversaires peuvent <b>coincher</b> (×2), l'équipe du contrat peut <b>surcoincher</b> (×4). Si le contrat est rempli, l'équipe marque le contrat + ses points ; sinon, les adversaires marquent 160 + le contrat.</p><p><b>Annonces (option) :</b> Tierce 20, Cinquante 50, Cent 100, Carrés (Valets 200, 9 150, autres 100). Seule la meilleure annonce compte ; son équipe marque toutes ses annonces.</p><p><b>Astuce :</b> touche une carte pour la soulever, touche-la encore pour la jouer. Les cartes grisées ne sont pas jouables.</p>";
window.addEventListener("resize", function () { if (g) renderHand(); });
