<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>Fruits de Dakar – Puzzle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0f1720;color:#f4f1e8;font-family:-apple-system,system-ui,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
a{color:inherit}
.scr{display:none;position:absolute;inset:0;overflow:auto;padding:max(10px,env(safe-area-inset-top)) 14px 20px}
.scr.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.back{font-size:14px;color:#e0b43c;text-decoration:none;font-weight:700}
h1{font-size:26px;margin:4px 0 2px;text-align:center;color:#e0b43c;letter-spacing:.5px}
.sub{text-align:center;opacity:.75;font-size:14px;margin-bottom:12px}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;font-size:16px;background:#e0b43c;color:#2a1d00;cursor:pointer}
.btn.sec{background:#243245;color:#f4f1e8}
.btn:active{transform:scale(.97)}
.map{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;padding:6px 0 30px}
.lv{aspect-ratio:1;border-radius:50%;border:3px solid #34465e;background:#1b2838;color:#f4f1e8;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative;cursor:pointer}
.lv small{font-size:10px;margin-top:3px;letter-spacing:1px;color:#e0b43c}
.lv.cur{background:#e0b43c;color:#2a1d00;border-color:#fff;animation:pul 1.3s infinite}
.lv.done{border-color:#e0b43c}
.lv.lock{opacity:.35;cursor:default}
.zone{grid-column:1/-1;font-weight:800;color:#e0b43c;font-size:15px;margin-top:6px;border-bottom:1px solid #34465e;padding-bottom:3px}
@keyframes pul{50%{transform:scale(1.08)}}
#game{padding:max(8px,env(safe-area-inset-top)) 10px 10px;display:none;flex-direction:column;align-items:center}
#game.on{display:flex}
.hud{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pill{background:#1b2838;border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
.pill b{display:block;font-size:20px;line-height:1.1}
.pill span{font-size:10px;opacity:.7;letter-spacing:.8px}
#goal{width:100%;max-width:440px;margin:8px 0;background:#1b2838;border-radius:12px;padding:8px 10px;font-size:14px}
.bar{height:10px;background:#0f1720;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0b43c,#ff9e2c);transition:width .3s}
#cvw{position:relative;width:100%;max-width:440px}
canvas{display:block;width:100%;touch-action:none;border-radius:16px;background:#162232}
.boost{display:flex;gap:8px;margin-top:10px;width:100%;max-width:440px}
.boost button{flex:1;appearance:none;border:2px solid #34465e;background:#1b2838;color:#f4f1e8;border-radius:12px;padding:8px 2px;font:inherit;font-size:12px;font-weight:700}
.boost button b{display:block;font-size:20px}
.boost button.on{border-color:#e0b43c;background:#3a2f12}
.boost button:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(5,10,16,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov.on{display:flex}
.card{background:#1b2838;border:2px solid #e0b43c;border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%}
.card h2{margin:0 0 6px;color:#e0b43c}
.stars{font-size:38px;letter-spacing:4px;margin:6px 0}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(224,180,60,.95);color:#2a1d00;font-weight:800;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
</style>
</head>
<body>
<div id="home" class="scr on">
  <div class="top"><a class="back" href="./index.html">← Salle de jeux</a><button class="btn sec" id="snd" style="padding:6px 10px;font-size:14px">🔊</button></div>
  <h1>🥭 Fruits de Dakar</h1>
  <div class="sub">Aligne 3 fruits ou plus · <span id="tot">0</span> ⭐ · Niveau <span id="cl">1</span></div>
  <div id="map" class="map"></div>
  <div style="text-align:center"><button class="btn" id="daily">🎁 Cadeau du jour</button></div>
</div>
<div id="game" class="scr">
  <div class="hud">
    <button class="btn sec" id="gback" style="padding:8px 12px">✕</button>
    <div class="pill"><b id="hLv">1</b><span>NIVEAU</span></div>
    <div class="pill"><b id="hMv">20</b><span>COUPS</span></div>
    <div class="pill"><b id="hSc">0</b><span>SCORE</span></div>
  </div>
  <div id="goal"><div id="gtxt"></div><div class="bar"><i id="gbar"></i></div></div>
  <div id="cvw"><canvas id="cv"></canvas></div>
  <div class="boost">
    <button id="bHam"><b>🔨</b>Marteau <span id="nHam"></span></button>
    <button id="bShu"><b>🔀</b>Mélange <span id="nShu"></span></button>
    <button id="bMov"><b>➕</b>+5 coups <span id="nMov"></span></button>
  </div>
</div>
<div id="ov" class="ov"><div class="card" id="ovc"></div></div>
<div id="toast"></div>
<script>

<script>
/* ===== interface ===== */
var $ = function (i) { return document.getElementById(i); };
var SAVE = { lv: 1, stars: {}, ham: 2, shu: 2, mov: 2, snd: 1, gift: "", wins: 0 };

var FR = ["🥭", "🌺", "🍊", "🍌", "🍉", "🥜"], COL = [["#ffc83d", "#e8920c"], ["#ff5e8a", "#c2185b"], ["#ff9a3c", "#e65100"], ["#fff176", "#f9a825"], ["#6fe08a", "#1e9e4a"], ["#d9a066", "#8d5a2b"]];
/* son */
