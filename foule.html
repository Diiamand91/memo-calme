 cx.fillStyle="#fff";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(txt,x,y+1)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
/* ---------- boucle ---------- */
var last=0,acc=0;
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;var FIX=1/120;while(acc>=FIX){step(FIX);acc-=FIX}
 if(LV){if(P.mode==="menu"||P.mode==="ready"){P.t+=dt;var r=P.mode==="menu"?menuDemo(dt):0}render()}requestAnimationFrame(loop)}
function menuDemo(dt){var cc=crowdC(Math.min(P.units.length,NU_CAP));for(var i=0;i<P.units.length;i++){var U=P.units[i],s=slot(i,cc);U.ox+=(s[0]-U.ox)*Math.min(1,dt*8);U.oz+=(s[1]-U.oz)*Math.min(1,dt*8)}return 0}

var drag=null;
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(P.mode==="ready"){P.mode="run";$("hint").style.display="none";A()}if(P.mode==="run"||P.mode==="battle"){drag={x:e.clientX,tx:P.tx};try{cv.setPointerCapture(e.pointerId)}catch(x){}}});
cv.addEventListener("pointermove",function(e){if(!drag)return;e.preventDefault();P.tx=drag.tx+(e.clientX-drag.x)/RS*1.25});
function endDrag(){drag=null}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

  $("pR").onclick=function(){$("ov").classList.remove("on");P.mode=prev};$("pA").onclick=function(){$("ov").classList.remove("on");begin(CUR)};$("pM").onclick=function(){$("ov").classList.remove("on");toMenu()};$("pS").onclick=function(){SV.snd=SV.snd?0:1;persist();$("pS").textContent=SV.snd?"🔊 Son activé":"🔇 Son coupé"}}};
$("mRules").onclick=function(){var c=$("cd");c.innerHTML="<h2>Comment jouer</h2><p style='text-align:left'>👆 <b>Glisse</b> le doigt pour guider ta foule à gauche ou à droite.<br>🚪 Passe dans les portes <b style='color:#7bb6ff'>bleues</b> (+ et ×) pour grossir, évite les <b style='color:#ff8b80'>rouges</b> (− et ÷).<br>⚙️ Les <b>scies</b> tuent les soldats qu'elles touchent.<br>🧍 Ramasse les soldats gris pour renforcer ta foule.<br>⚔️ Face aux ennemis rouges, vous vous éliminez un par un : arrive avec plus de soldats qu'eux !<br>👹 Bats le <b>boss</b> final pour gagner des pièces et améliorer ton équipe.</p><button class='btn' id='okB'>OK</button>";$("ov").classList.add("on");$("okB").onclick=function(){$("ov").classList.remove("on")}};
function upCost(k){var l=SV.up[k];return k==="start"?40+l*35:60+l*50}
$("mShop").onclick=function(){shop()};
function shop(){var c=$("cd"),h="<h2>Boutique</h2><div class='pill'>🪙 "+SV.coins+"</div>";
 [["start","Soldats de départ","+2 soldats au début (actuel : "+startN()+")",20],["gain","Butin","+15% de pièces par victoire (actuel : +"+SV.up.gain*15+"%)",10]].forEach(function(u){var l=SV.up[u[0]],mx=u[3],cost=upCost(u[0]);h+="<div class='shop'><div class='sw' style='background:#ffd34a;display:flex;align-items:center;justify-content:center;color:#3a2500;font-weight:900'>"+l+"</div><div><b>"+u[1]+"</b><small>"+u[2]+"</small></div><button data-u='"+u[0]+"'"+(l>=mx||SV.coins<cost?" disabled":"")+">"+(l>=mx?"MAX":"🪙 "+cost)+"</button></div>"});
 h+="<div style='margin:10px 0 2px;font-weight:800'>Couleur de ta foule</div>";SKINS.forEach(function(s,i){var own=SV.owned.indexOf(i)>=0;h+="<div class='shop'><div class='sw' style='background:"+s[1]+"'></div><div><b>"+s[0]+"</b></div><button data-s='"+i+"' class='"+(SV.skin===i?"on":"")+"'"+(!own&&SV.coins<s[2]?" disabled":"")+">"+(SV.skin===i?"✔ Utilisé":own?"Choisir":"🪙 "+s[2])+"</button></div>"});
 h+="<button class='btn' id='okB'>Fermer</button>";c.innerHTML=h;$("ov").classList.add("on");
 [].forEach.call(c.querySelectorAll("button[data-u]"),function(b){b.onclick=function(){var k=b.dataset.u,cost=upCost(k);if(SV.coins>=cost){SV.coins-=cost;SV.up[k]++;persist();SFX.coin();shop();renderMenu();loadLevel(SV.level,startN());P.mode="menu";P.z=2}}});
 [].forEach.call(c.querySelectorAll("button[data-s]"),function(b){b.onclick=function(){var i=+b.dataset.s,own=SV.owned.indexOf(i)>=0;if(!own){if(SV.coins<SKINS[i][2])return;SV.coins-=SKINS[i][2];SV.owned.push(i);SFX.coin()}SV.skin=i;persist();shop();renderMenu()}});
 $("okB").onclick=function(){$("ov").classList.remove("on")}}
