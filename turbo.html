var G=null,inp={l:0,r:0,n:0,b:0},paused=false,last=0,BOT=location.hash==="#bot";
function startRace(i){actx();var r=RACES[i];G=newRace(r,SV.sel,SV.upg[SV.sel]);G.idx=i;$("menu").classList.remove("on");$("ctl").classList.add("on");$("pz").classList.add("on");paused=false;last=performance.now();tone(500,.15)}
function bot(){var P=PL,seg=segAt(P.pos+PLAYZ),target=0;inp.l=inp.r=inp.n=inp.b=0;
 for(var n=1;n<14;n++){var sg=SEGS[(Math.floor((P.pos+PLAYZ)/SEG)+n)%SEGS.length];for(var q=0;q<sg.cars.length;q++){var c=sg.cars[q];if(c.sp<P.sp&&Math.abs(c.off-P.x)<.55){target=c.off>P.x?-.7:.7;if(c.off>.3)target=-.7;else if(c.off<-.3)target=.7;else target=c.off>0?-.7:.7}}}
 var curve=seg.curve;target+=0; var want=target-curve*.02;if(P.x<want-.08)inp.r=1;else if(P.x>want+.08)inp.l=1;
 if(Math.abs(curve)>5&&P.sp>P.max*.9)inp.b=0;if(P.nt>60&&Math.abs(curve)<2)inp.n=1}
function loop(ts){requestAnimationFrame(loop);if(!G||paused)return;var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;if(BOT)bot();
 G.time+=dt;
 if(G.state==="count"){G.cd-=dt;updCars(G,dt,false);if(Math.floor(G.cd+.6)!==Math.floor(G.cd+.6+dt)&&G.cd>0)tone(G.cd>.6?440:880,.15);if(G.cd<=.6){G.state="race";toast("GO !");tone(880,.4,.1)}}
 else{updPlayer(G,dt,inp);updCars(G,dt,true);
  if(G.state==="race"&&PL.prog>=G.r.laps*TL){G.state="fin";PL.fin=G.time;G.finT=0;G.place=rank();tone(660,.5,.12)}
  if(G.state==="fin"){G.finT+=dt;if(G.finT>2.6&&!G.over){G.over=1;endRace()}}}
 if(G.state==="count")updPlayer(G,dt,inp);
 engine(G.state!=="over"&&!G.over,PL.sp/MAXSP);render(G,inp)}
requestAnimationFrame(loop);
function endRace(){var r=G.r,pl=G.place,P=PL,rew=(r.rew[pl-1]||20)+P.coins;SV.coins+=rew;var prev=SV.best[G.idx];if(!prev||pl<prev)SV.best[G.idx]=pl;save();engine(0,0);
 var med=["🥇","🥈","🥉","4ᵉ","5ᵉ","6ᵉ"][pl-1];var un=pl<=3&&G.idx<RACES.length-1&&(!prev||prev>3);
 $("md").innerHTML="<h2>"+med+" Position "+pl+"/6</h2><table><tr><td>Récompense</td><td>"+fmt(r.rew[pl-1]||20)+" 🪙</td></tr><tr><td>Frôlements ("+P.miss+")</td><td>+"+fmt(P.coins)+" 🪙</td></tr><tr><td>Collisions</td><td>"+P.hits+"</td></tr></table>"+(un?"<p style='text-align:center;color:#7be39a'><b>🔓 Nouvelle course débloquée !</b></p>":pl>3?"<p class='mut' style='text-align:center'>Termine sur le podium (top 3) pour débloquer la course suivante. Améliore ta voiture au garage !</p>":"")+"<button class='btn' id='rA'>Rejouer</button><button class='btn sec' id='rM'>Menu</button>";$("ov").classList.add("on");
 $("rA").onclick=function(){$("ov").classList.remove("on");startRace(G.idx)};$("rM").onclick=function(){$("ov").classList.remove("on");G=null;menu()}}
$("pz").onclick=function(){if(!G)return;paused=true;engine(0,0);$("md").innerHTML="<h2>⏸ Pause</h2><button class='btn' id='pR'>Reprendre</button><button class='btn sec' id='pQ'>Quitter la course</button>";$("ov").classList.add("on");$("pR").onclick=function(){$("ov").classList.remove("on");paused=false;last=performance.now()};$("pQ").onclick=function(){$("ov").classList.remove("on");G=null;paused=false;menu()}};
/* ----- commandes ----- */
function hold(id,key){var b=$(id);function d(e){e.preventDefault();inp[key]=1;b.classList.add("dn")}function u(e){e.preventDefault();inp[key]=0;b.classList.remove("dn")}b.addEventListener("pointerdown",d);b.addEventListener("pointerup",u);b.addEventListener("pointercancel",u);b.addEventListener("pointerleave",u);b.addEventListener("contextmenu",function(e){e.preventDefault()})}
hold("bL","l");hold("bR","r");hold("bN","n");hold("bB","b");
var KM={ArrowLeft:"l",ArrowRight:"r",ArrowDown:"b"," ":"n"};addEventListener("keydown",function(e){var k=KM[e.key];if(k){inp[k]=1;e.preventDefault()}});addEventListener("keyup",function(e){var k=KM[e.key];if(k)inp[k]=0});
document.addEventListener("touchmove",function(e){if(G&&!paused)e.preventDefault()},{passive:false});
document.addEventListener("visibilitychange",function(){if(document.hidden&&G&&!paused&&G.state!=="fin")$("pz").click()});
menu();
</script></body></html>
