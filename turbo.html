 if(TABM==="race"){var u=unlocked();RACES.forEach(function(r,i){var lock=isLock(i,u),b=SV.best[i],th=THEMES[r.track];h+="<div class='card"+(lock?" lock":"")+(r.chase?" chase":"")+"'><div class='row'><div class='sp'><b>Course "+(i+1)+" · "+th.n+"</b>"+(r.chase?"<span class='tag'>🚓 POURSUITE</span>":"")+"<div class='mut'>"+r.laps+" tours"+(r.obs?" · 🚧 obstacles":"")+" · rivaux "+["débutants","confirmés","experts"][r.lvl]+(r.chase?" · "+r.cops+" voitures de police":"")+"</div><div class='mut'>🥇 "+fmt(r.rew[0])+" 🪙"+(b?" · meilleur : "+b+"ᵉ":"")+"</div></div>"+(lock?"<span class='medal'>🔒</span>":"<button class='btn sm' data-go='"+i+"'>▶ Courir</button>")+"</div></div>"})}
 else if(TABM==="gar"){h+=garage()}
 else{h+="<div class='card'><div class='row'><div class='sp'><b>Son</b></div><button class='btn sm sec' id='bs'>"+(SND?"🔊 Activé":"🔇 Coupé")+"</button></div></div><div class='card'><b>Commandes</b><div class='mut' style='margin-top:6px;font-size:14px;line-height:1.6'>Accélération automatique.<br>👈 Touche le <b>côté gauche</b> de l'écran pour tourner à gauche.<br>👉 Touche le <b>côté droit</b> pour tourner à droite.<br>✋ Les <b>deux côtés</b> ensemble = frein.<br>🔥 Bouton NITRO en bas à droite.<br>Évite le trafic et les glissières : les gros chocs font des tête‑à‑queue et abîment ta voiture.<br>🚓 En poursuite, ne laisse pas la police rester derrière toi : la jauge d'arrestation monte, et chaque choc avec elle l'augmente.<br>Clavier : ← → · ↓ frein · Espace nitro.</div></div><button class='btn sec' id='br'>🗑️ Effacer ma progression</button>"}
 m.innerHTML=h;m.scrollTop=m._st||0;
 m.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){m._st=0;TABM=b.dataset.t;menu()}});
 m.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){startRace(+b.dataset.go)}});
 if($("bs"))$("bs").onclick=function(){SND=SND?0:1;SV.snd=SND;save();menu()};
 if($("br"))$("br").onclick=function(){if(confirm("Tout effacer ?")){localStorage.removeItem(KEY);location.reload()}};
 m.querySelectorAll("[data-buy]").forEach(function(b){b.onclick=function(){var i=+b.dataset.buy;if(SV.coins>=CARS[i].cost){SV.coins-=CARS[i].cost;SV.owned[i]=1;SV.sel=i;save();tone(700,.15);m._st=m.scrollTop;menu()}}});
 m.querySelectorAll("[data-sel]").forEach(function(b){b.onclick=function(){SV.sel=+b.dataset.sel;save();m._st=m.scrollTop;menu()}});
 m.querySelectorAll("[data-up]").forEach(function(b){b.onclick=function(){var a=b.dataset.up.split(","),ci=+a[0],k=+a[1],l=SV.upg[ci][k],c=upCost(l);if(l<5&&SV.coins>=c){SV.coins-=c;SV.upg[ci][k]++;save();tone(800,.12);m._st=m.scrollTop;menu()}}})}
function upCost(l){return Math.round(250*Math.pow(1.7,l)/10)*10}
function garage(){var h="";CARS.forEach(function(c,i){var own=SV.owned[i],s=stats(i,SV.upg[i]);h+="<div class='card"+(SV.sel===i?" sel":"")+"'><div class='row'><div style='width:84px;height:62px'><canvas width='168' height='124' data-car='"+i+"' style='width:84px;height:62px'></canvas></div><div class='sp'><b>"+c.n+"</b><div class='mut'>"+c.d+"</div><div class='mut'>⚡ vitesse "+Math.round(s.max/MAXSP*290)+" km/h</div></div>"+(own?(SV.sel===i?"<span class='medal'>✅</span>":"<button class='btn sm sec' data-sel='"+i+"'>Choisir</button>"):"<button class='btn sm' data-buy='"+i+"'"+(SV.coins<c.cost?" disabled":"")+">"+fmt(c.cost)+" 🪙</button>")+"</div>";
 if(own){UPN.forEach(function(n,k){var l=SV.upg[i][k];h+="<div class='row' style='margin-top:8px'><div class='sp'><div style='font-size:13px'><b>"+n+"</b> · niv "+l+"/5</div><div class='bar'><i style='width:"+l*20+"%'></i></div></div>"+(l<5?"<button class='btn sm' data-up='"+i+","+k+"'"+(SV.coins<upCost(l)?" disabled":"")+">"+fmt(upCost(l))+" 🪙</button>":"<b class='mut'>MAX</b>")+"</div>"})}h+="</div>"});
 setTimeout(function(){TH=TH||THEMES[0];document.querySelectorAll("[data-car]").forEach(function(c){var x=c.getContext("2d"),i=+c.dataset.car,old=cx;cx=x;x.clearRect(0,0,168,124);drawCar(84,112,110,CARS[i],{});cx=old})},0);return h}
var G=null,inp={l:0,r:0,n:0,b:0},paused=false,last=0,BOT=location.hash==="#bot";
function startRace(i){actx();var r=RACES[i];G=newRace(r,SV.sel,SV.upg[SV.sel]);G.idx=i;$("menu").classList.remove("on");$("ctl").classList.add("on");$("tz").classList.add("on");$("pz").classList.add("on");paused=false;last=performance.now();inp.l=inp.r=inp.n=inp.b=0;TN.clear();tone(500,.15)}
function bot(){var P=PL,seg=segAt(P.pos+PLAYZ),target=0;inp.l=inp.r=inp.n=inp.b=0;
 for(var n=1;n<14;n++){var sg=SEGS[(Math.floor((P.pos+PLAYZ)/SEG)+n)%SEGS.length];for(var q=0;q<sg.cars.length;q++){var c=sg.cars[q];if(c.sp<P.sp&&Math.abs(c.off-P.x)<.7){if(c.off>.3)target=-.7;else if(c.off<-.3)target=.7;else target=c.off>0?-.7:.7}}}
 var want=target-seg.curve*.02;if(P.x<want-.08)inp.r=1;else if(P.x>want+.08)inp.l=1;if(P.nt>60&&Math.abs(seg.curve)<2)inp.n=1}
function loop(ts){requestAnimationFrame(loop);if(!G||paused)return;var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;if(BOT)bot();
 G.time+=dt;
 if(G.state==="count"){G.cd-=dt;updCars(G,dt,false);if(Math.floor(G.cd+.6)!==Math.floor(G.cd+.6+dt)&&G.cd>0)tone(G.cd>.6?440:880,.15);if(G.cd<=.6){G.state="race";toast("GO !");tone(880,.4,.1)}updPlayer(G,dt,inp)}
 else{updPlayer(G,dt,inp);updCars(G,dt,true);
  if(G.state==="race"&&PL.prog>=G.r.laps*TL){G.state="fin";PL.fin=G.time;G.finT=0;G.place=rank();tone(660,.5,.12)}
  if(G.state==="race"&&G.r.chase){var dn=1e9;CP.forEach(function(c){var d=wrapD(c.z-(PL.pos+PLAYZ));if(d<0&&d>-3000)dn=Math.min(dn,-d)});if(dn<3000&&Math.floor(G.time*2.2)!==Math.floor((G.time-dt)*2.2))tone(Math.floor(G.time*2.2)%2?720:960,.35,.03)}
  if(G.state==="fin"){G.finT+=dt;if(G.finT>2.4&&!G.over){G.over=1;endRace()}}}
 engine(!G.over,PL.sp/MAXSP);render(G,inp)}
requestAnimationFrame(loop);
function endRace(){var r=G.r,P=PL,pl=G.busted?RV.length+1:G.place,rew=G.busted?30:(r.rew[pl-1]||20)+P.coins;SV.coins+=rew;var prev=SV.best[G.idx];if(!G.busted&&(!prev||pl<prev))SV.best[G.idx]=pl;save();engine(0,0);
 var med=G.busted?"🚔":["🥇","🥈","🥉","4ᵉ","5ᵉ","6ᵉ"][pl-1];var un=!G.busted&&pl<=3&&G.idx<RACES.length-1&&(!prev||prev>3);
 $("md").innerHTML="<h2>"+(G.busted?"🚔 Arrêté par la police !":med+" Position "+pl+"/"+(RV.length+1))+"</h2><table>"+(G.busted?"<tr><td>Consolation</td><td>30 🪙</td></tr>":"<tr><td>Récompense</td><td>"+fmt(r.rew[pl-1]||20)+" 🪙</td></tr><tr><td>Frôlements ("+P.miss+")</td><td>+"+fmt(P.coins)+" 🪙</td></tr>")+"<tr><td>Chocs</td><td>"+P.hits+"</td></tr><tr><td>État de la voiture</td><td>"+Math.round(100-P.dmg)+" %</td></tr></table>"+(un?"<p style='text-align:center;color:#7be39a'><b>🔓 Nouvelle course débloquée !</b></p>":(G.busted?"<p class='mut' style='text-align:center'>Évite les chocs avec la police et garde de la vitesse : les voitures de police doivent rester loin derrière toi.</p>":pl>3?"<p class='mut' style='text-align:center'>Termine sur le podium (top 3) pour débloquer la suite. Améliore ta voiture au garage !</p>":""))+"<button class='btn' id='rA'>Rejouer</button><button class='btn sec' id='rM'>Menu</button>";$("ov").classList.add("on");
 $("rA").onclick=function(){$("ov").classList.remove("on");startRace(G.idx)};$("rM").onclick=function(){$("ov").classList.remove("on");G=null;menu()}}
$("pz").onclick=function(){if(!G)return;paused=true;engine(0,0);inp.l=inp.r=0;TN.clear();$("md").innerHTML="<h2>⏸ Pause</h2><button class='btn' id='pR'>Reprendre</button><button class='btn sec' id='pQ'>Quitter la course</button>";$("ov").classList.add("on");$("pR").onclick=function(){$("ov").classList.remove("on");paused=false;last=performance.now()};$("pQ").onclick=function(){$("ov").classList.remove("on");G=null;paused=false;menu()}};
/* ----- commandes : toucher les côtés de l'écran ----- */
var TN=new Map();TN.sync=function(){var l=0,r=0;TN.forEach(function(s){if(s<0)l=1;else r=1});inp.l=l;inp.r=r};
(function(){var z=$("tz");function side(e){return e.clientX<innerWidth/2?-1:1}
 z.addEventListener("pointerdown",function(e){e.preventDefault();actx();try{z.setPointerCapture(e.pointerId)}catch(x){}TN.set(e.pointerId,side(e));TN.sync()});
 z.addEventListener("pointermove",function(e){if(TN.has(e.pointerId)){TN.set(e.pointerId,side(e));TN.sync()}});
 function up(e){TN.delete(e.pointerId);TN.sync()}z.addEventListener("pointerup",up);z.addEventListener("pointercancel",up);z.addEventListener("lostpointercapture",up);z.addEventListener("contextmenu",function(e){e.preventDefault()})})();
(function(){var b=$("bN");function d(e){e.preventDefault();inp.n=1;b.classList.add("dn")}function u(e){e.preventDefault();inp.n=0;b.classList.remove("dn")}b.addEventListener("pointerdown",d);b.addEventListener("pointerup",u);b.addEventListener("pointercancel",u);b.addEventListener("pointerleave",u)})();
var KM={ArrowLeft:"l",ArrowRight:"r",ArrowDown:"b"," ":"n"};addEventListener("keydown",function(e){var k=KM[e.key];if(k){inp[k]=1;e.preventDefault()}});addEventListener("keyup",function(e){var k=KM[e.key];if(k)inp[k]=0});
document.addEventListener("touchmove",function(e){if(G&&!paused)e.preventDefault()},{passive:false});
document.addEventListener("visibilitychange",function(){if(document.hidden&&G&&!paused&&G.state!=="fin")$("pz").click()});
menu();
</script></body></html>
