<script>

var RECIPES=[
 {id:"dibi",n:"Sandwich Dibi",e:"🥖",st:["pain","viande","oignon","moutarde"],price:1500,lv:1},
 {id:"burger",n:"Burger Teranga",e:"🍔",st:["bun","viande","fromage","salade","tomate","bun"],price:2400,lv:2},
 {id:"chawarma",n:"Chawarma poulet",e:"🌯",st:["galette","poulet","salade","sauce","oignon"],price:2800,lv:3}];

 {id:"bissap",n:"Bissap",e:"🥤",price:500,lv:1,cook:0},
 {id:"frites",n:"Frites",e:"🍟",price:800,lv:2,cook:1},
 {id:"gingembre",n:"Gingembre",e:"🧃",price:500,lv:3,cook:0},
 {id:"pastel",n:"Pastels",e:"🥟",price:1100,lv:4,cook:1},
 {id:"touba",n:"Café Touba",e:"☕",price:700,lv:5,cook:0}];
var COOK={viande:{t:5.5,dev:"grill",tray:"stack"},poulet:{t:6.5,dev:"grill",tray:"stack"},frites:{t:4.5,dev:"fry",tray:"side"},pastel:{t:5.5,dev:"fry",tray:"side"}};
var RAW={viande:"🥩",poulet:"🍗",frites:"🥔",pastel:"🐟"};
var DONE={viande:"🥩",poulet:"🍗",frites:"🍟",pastel:"🥟"};
var XPT=[0,45,150,330,560,880,1300,1900,2700,3800];
var TIERS=[{n:"La Baraque",m:1,rent:400},{n:"La Boutique",m:1.35,rent:900},{n:"Le Resto",m:1.8,rent:1800}];
var UPG=[
 {id:"grill",n:"Plaques de grill",e:"🔥",d:"+1 emplacement de cuisson",max:3,cost:[8000,14500,24000],lv:1},
 {id:"gspeed",n:"Grill rapide",e:"⚡",d:"Cuisson 12 % plus rapide",max:4,cost:[6500,13000,22500,38500],lv:1},
 {id:"fry",n:"Friteuse",e:"🍟",d:"+1 panier de friture",max:2,cost:[9500,19000],lv:2},
 {id:"spots",n:"Comptoir",e:"🪑",d:"+1 place pour les clients",max:2,cost:[9500,22500],lv:1},
 {id:"decor",n:"Décoration",e:"🎨",d:"Clients plus patients, meilleurs pourboires",max:3,cost:[13000,29000,64000],lv:2},
 {id:"helper",n:"Aide-cuisinier",e:"👨🏾‍🍳",d:"Lance la cuisson tout seul",max:2,cost:[24000,56000],lv:3},
 {id:"cashier",n:"Caissier",e:"🧑🏾‍💼",d:"Les clients attendent plus longtemps",max:2,cost:[19000,45000],lv:2},
 {id:"mkt",n:"Marketing",e:"📣",d:"Plus de clients",max:3,cost:[16000,35000,72000],lv:2},
 {id:"tier",n:"Agrandir le local",e:"🏠",d:"Nouveau local : tous les prix augmentent",max:2,cost:[96000,320000],lv:4}];
var UPID={};UPG.forEach(function(u){UPID[u.id]=u});
function newGame(name){return{v:1,name:name||"Teranga Grill",cash:0,day:1,xp:0,lvl:1,rating:3,up:{grill:0,gspeed:0,fry:0,spots:0,decor:0,helper:0,cashier:0,mkt:0,tier:0},stats:{served:0,lost:0,best:0,earned:0},hist:[],tut:1,ach:{},pace:1}}
function levelOf(xp){var l=1;for(var i=0;i<XPT.length;i++)if(xp>=XPT[i])l=i+1;return l}
function tierM(P){return TIERS[P.up.tier].m}
function grillSlots(P){return 2+P.up.grill}function frySlots(P){return 1+P.up.fry}function spots(P){return 3+P.up.spots}
function cookTime(P,k){return COOK[k].t*(1-.12*P.up.gspeed)}
function availRecipes(P){return RECIPES.filter(function(r){return r.lv<=P.lvl})}
function availSides(P){return SIDES.filter(function(s){return s.lv<=P.lvl})}
function recOf(id){for(var i=0;i<RECIPES.length;i++)if(RECIPES[i].id===id)return RECIPES[i];return null}
function sideOf(id){for(var i=0;i<SIDES.length;i++)if(SIDES[i].id===id)return SIDES[i];return null}
function dayLen(P){return 90}
function dayGoal(P){return Math.round((13000+P.day*1500)*tierM(P)/500)*500}
/* ---- journée ---- */
function startDay(P){var D={t:0,len:dayLen(P),cust:[],spawnT:1.2,nid:1,tray:{stack:[],sides:[]},grill:[],fry:[],earned:0,served:0,lost:0,combo:0,maxCombo:0,tips:0,hint:"",done:0,helperT:0,goal:dayGoal(P),cogs:0};
 for(var i=0;i<grillSlots(P);i++)D.grill.push({k:null,t:0,st:"empty"});for(i=0;i<frySlots(P);i++)D.fry.push({k:null,t:0,st:"empty"});return D}
function genOrder(P){var rs=availRecipes(P),ss=availSides(P),rec=null,sides=[],r=Math.random();
 if(r<.88||ss.length===0)rec=rs[Math.floor(Math.random()*rs.length)];
 var nS=Math.random(),n=nS<.5?0:nS<.88?1:2;if(!rec&&n===0)n=1;n=Math.min(n,ss.length,rec?2:2);
 var pool=ss.slice();for(var i=0;i<n;i++){var k=Math.floor(Math.random()*pool.length);sides.push(pool[k].id);pool.splice(k,1)}
 return{rec:rec?rec.id:null,sides:sides}}
function orderPrice(P,o){var p=o.rec?recOf(o.rec).price:0;o.sides.forEach(function(s){p+=sideOf(s).price});return Math.round(p*tierM(P)/10)*10}
function patienceFor(P,o,day){var n=(o.rec?recOf(o.rec).st.length:0)+o.sides.length*2;var base=32+n*4.2;base*=1+.08*P.up.decor;base*=1+.22*P.up.cashier;base*=Math.max(.72,1-day*.01);return base}
function spawnCustomer(P,D){var o=genOrder(P),pm=patienceFor(P,o,P.day);D.cust.push({id:D.nid++,order:o,pat:pm,pm:pm,price:orderPrice(P,o),face:Math.floor(Math.random()*8),age:0})}
function spawnGap(P,D){return Math.max(4.6,9.4-P.day*.2-P.up.mkt*.7-(D.t>30&&D.t<60?1.2:0))*(.85+Math.random()*.3)}
function tick(P,D,dt){if(D.done)return;D.t+=dt;
 D.spawnT-=dt;if(D.spawnT<=0&&D.t<D.len-8){if(D.cust.length<spots(P))spawnCustomer(P,D);D.spawnT=spawnGap(P,D)*(P.pace||1)}
 var i;for(i=D.cust.length-1;i>=0;i--){var c=D.cust[i];c.pat-=dt;c.age+=dt;if(c.pat<=0){D.cust.splice(i,1);D.lost++;D.combo=0;P.rating=Math.max(1,P.rating-.12);P.stats.lost++;D.lastEvent={t:"lost",c:c}}}
 [["grill",D.grill],["fry",D.fry]].forEach(function(dv){dv[1].forEach(function(s){if(s.st==="cook"){s.t-=dt;if(s.t<=0){s.st="ready";s.t=7}}else if(s.st==="ready"){s.t-=dt;if(s.t<=0){s.st="burnt"}}})});
 if(P.up.helper>0){D.helperT-=dt;if(D.helperT<=0){D.helperT=2.6-P.up.helper*.6;
  var want={};D.cust.forEach(function(c){if(c.order.rec)recOf(c.order.rec).st.forEach(function(k){if(COOK[k])want[k]=(want[k]||0)+1});c.order.sides.forEach(function(k){if(COOK[k])want[k]=(want[k]||0)+1})});
  for(var k in want){var have=0;[D.grill,D.fry].forEach(function(a){a.forEach(function(s){if(s.k===k&&(s.st==="cook"||s.st==="ready"))have++})});if(have<want[k]){var dev=COOK[k].dev==="grill"?D.grill:D.fry,sl=null;dev.forEach(function(s){if(!sl&&s.st==="empty")sl=s});if(sl){sl.k=k;sl.st="cook";sl.t=cookTime(P,k);break}}}}}
 if(D.t>=D.len&&D.cust.length===0)D.done=1;if(D.t>=D.len+45)D.done=1}
/* ---- actions ---- */
function cookStart(P,D,dev,i,k){var arr=dev==="grill"?D.grill:D.fry,s=arr[i];if(!s||s.st!=="empty")return"occupied";if(COOK[k].dev!==dev)return"bad";s.k=k;s.st="cook";s.t=cookTime(P,k);return null}
function takeCooked(P,D,dev,i){var arr=dev==="grill"?D.grill:D.fry,s=arr[i];if(!s)return"none";if(s.st==="burnt"){s.st="empty";s.k=null;return"burnt"}
 if(s.st!=="ready")return"wait";var k=s.k,c=COOK[k];if(c.tray==="stack"){if(D.tray.stack.length>=8)return"full";D.tray.stack.push(k)}else{if(D.tray.sides.indexOf(k)>=0)return"dup";D.tray.sides.push(k)}s.st="empty";s.k=null;return null}
function addIng(P,D,id){if(D.tray.stack.length>=8)return"full";D.tray.stack.push(id);return null}
function addSide(P,D,id){if(D.tray.sides.indexOf(id)>=0)return"dup";D.tray.sides.push(id);return null}
function clearTray(D){D.tray.stack=[];D.tray.sides=[]}
function undoIng(D){D.tray.stack.pop()}
function sameArr(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
function trayMatches(D,o){var st=o.rec?recOf(o.rec).st:[];if(!sameArr(D.tray.stack,st))return false;var a=D.tray.sides.slice().sort(),b=o.sides.slice().sort();return sameArr(a,b)}
function whyNot(D,o){var st=o.rec?recOf(o.rec).st:[],s=D.tray.stack;if(s.length===0&&D.tray.sides.length===0)return"Le plateau est vide.";
 for(var i=0;i<s.length;i++){if(i>=st.length)return"Il y a trop d'ingrédients.";if(s[i]!==st[i])return"L'ordre n'est pas bon : "+ING[st[i]].n+" attendu à l'étape "+(i+1)+"."}
 if(s.length<st.length)return"Il manque : "+ING[st[s.length]].n+".";
 for(var j=0;j<o.sides.length;j++)if(D.tray.sides.indexOf(o.sides[j])<0)return"Il manque : "+sideOf(o.sides[j]).n+".";
 return"Il y a quelque chose en trop."}
function serve(P,D,ci){var c=D.cust[ci];if(!c)return{ok:0,msg:"?"};if(!trayMatches(D,c.order))return{ok:0,msg:whyNot(D,c.order)};
 var f=Math.max(0,c.pat/c.pm),tip=c.price*(.12+.28*f)*(1+.1*P.up.decor),cb=D.combo>=6?.2:D.combo>=3?.1:0,bonus=c.price*cb;var pay=Math.round((c.price+tip+bonus)/10)*10;
 D.cust.splice(ci,1);D.earned+=pay;D.tips+=Math.round(tip+bonus);D.served++;D.combo++;D.maxCombo=Math.max(D.maxCombo,D.combo);D.cogs+=Math.round(c.price*.32);
 P.xp+=Math.ceil(pay/450)+1;var nl=levelOf(P.xp),up=nl>P.lvl;P.lvl=nl;P.stats.served++;P.rating=Math.min(5,P.rating+(f>.5?.06:.02));clearTray(D);return{ok:1,pay:pay,tip:Math.round(tip+bonus),lvlUp:up,c:c}}
function endDay(P,D){var rent=TIERS[P.up.tier].rent,gross=D.earned,cogs=D.cogs,profit=gross-cogs-rent,stars=gross>=D.goal*1.8?3:gross>=D.goal*1.35?2:gross>=D.goal?1:0,bonus=Math.round(gross>=D.goal?gross*.05*stars:0);
