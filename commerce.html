<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>Petit Commerce</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1720;color:#f4f1e8;font-family:-apple-system,system-ui,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button,input{font:inherit}
a{color:#e0b43c;text-decoration:none;font-weight:700}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#intro{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 50% 0%,#2a3a52,#0f1720 70%);padding:max(14px,env(safe-area-inset-top)) 16px 24px;overflow:auto;display:none}
#intro.on{display:block}
h1{margin:6px 0 4px;text-align:center;color:#e0b43c;font-size:27px}
.sub{text-align:center;opacity:.8;font-size:14px;margin-bottom:14px}
.lab{font-size:12px;letter-spacing:1px;opacity:.7;margin:12px 0 6px;font-weight:700}
.inp{width:100%;background:#1b2838;border:2px solid #34465e;color:#f4f1e8;border-radius:12px;padding:12px;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:2px solid #34465e;background:#1b2838;color:#f4f1e8;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px;flex:1 1 auto}
.chip.on{background:#e0b43c;border-color:#e0b43c;color:#2a1d00}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;flex:none}
.sw.on{border-color:#fff}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:17px;background:#e0b43c;color:#2a1d00;width:100%}
.btn.sec{background:#243245;color:#f4f1e8}.btn.red{background:#b33a3a;color:#fff}.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:disabled{opacity:.4}.btn:active{transform:scale(.98)}
#top{flex:none;padding:max(6px,env(safe-area-inset-top)) 10px 6px;background:#16212f;display:flex;align-items:center;gap:8px;border-bottom:1px solid #26364b}
#top .day{font-size:12px;line-height:1.2;opacity:.9}#top .day b{display:block;font-size:15px;color:#e0b43c}
#cash{flex:1;text-align:center;font-weight:900;font-size:20px;color:#7be39a}
#cash small{display:block;font-size:10px;color:#f4f1e8;opacity:.6;font-weight:600;letter-spacing:.6px}
.pill{background:#243245;border-radius:10px;padding:4px 8px;font-size:12px;text-align:center;line-height:1.2}
.ib{appearance:none;border:0;background:#243245;color:#fff;border-radius:10px;width:36px;height:36px;font-size:16px}
#main{flex:1;overflow:auto;padding:10px 10px 14px;-webkit-overflow-scrolling:touch}
#tabs{flex:none;display:flex;background:#16212f;border-top:1px solid #26364b;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;appearance:none;border:0;background:none;color:#9fb0c6;padding:8px 0 6px;font-size:11px;font-weight:700}
#tabs button b{display:block;font-size:20px;margin-bottom:1px}
#tabs button.on{color:#e0b43c}
.card{background:#1b2838;border-radius:16px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;color:#e0b43c}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mut{opacity:.65;font-size:12px}
canvas#sc{width:100%;border-radius:16px;display:block;background:#2a3a52}
.prod{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #26364b}
.prod:last-child{border:0}
.prod .e{font-size:26px;width:34px;text-align:center}
.prod .n{flex:1;min-width:0}.prod .n b{display:block;font-size:14px}.prod .n span{font-size:11px;opacity:.7}
.qb{display:flex;gap:4px}.qb button,.pm{appearance:none;border:0;background:#2e4562;color:#fff;border-radius:8px;padding:8px 9px;font-weight:800;font-size:13px;min-width:38px}
.qb button:active,.pm:active{background:#e0b43c;color:#2a1d00}
.up{color:#ff8a80}.dn{color:#7be39a}
.bar{height:7px;background:#0f1720;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#34465e;margin-left:4px}
.tag.w{background:#8a5a1a}.tag.r{background:#8a2a2a}
.news{font-size:13px;line-height:1.35;padding:6px 8px;border-left:3px solid #e0b43c;background:rgba(224,180,60,.08);border-radius:0 8px 8px 0;margin-bottom:6px}
#feed{font-size:12px;height:92px;overflow:hidden;opacity:.9;display:flex;flex-direction:column;justify-content:flex-end}
#feed div{padding:1px 0}
.ov{position:fixed;inset:0;background:rgba(5,10,16,.8);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.ov.on{display:flex}
.md{background:#1b2838;border:2px solid #e0b43c;border-radius:20px;padding:16px;max-width:380px;width:100%;max-height:90vh;overflow:auto;font-size:14px;line-height:1.4}
.md h2{margin:0 0 8px;color:#e0b43c;text-align:center;font-size:20px}
.md table{width:100%;border-collapse:collapse;margin:6px 0}.md td{padding:4px 2px;border-bottom:1px solid #26364b}.md td:last-child{text-align:right;font-weight:800}
.gn{color:#7be39a}.rd{color:#ff8a80}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#e0b43c;color:#2a1d00;font-weight:800;padding:8px 14px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
.tip{background:#2a3a1a;border:2px solid #7be39a;border-radius:14px;padding:10px;margin-bottom:10px;font-size:14px}
.sel{display:flex;gap:6px;overflow:auto;margin-bottom:8px}
.sel .chip{flex:none;padding:8px 10px;font-size:13px}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.upc{background:#243245;border-radius:12px;padding:8px;font-size:12px;border:2px solid transparent}
.upc.own{border-color:#7be39a}.upc b{display:block;font-size:13px}
.upc button{margin-top:4px;width:100%;appearance:none;border:0;background:#e0b43c;color:#2a1d00;border-radius:8px;padding:6px;font-weight:800;font-size:12px}
.upc button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a href="./index.html" class="ib" style="display:flex;align-items:center;justify-content:center;text-decoration:none">←</a>
    <div class="day"><b id="dDay">Jour 1</b><span id="dDow">Lundi</span></div>

    <button class="ib" id="bSet">⚙️</button></div>
  <div id="main"></div>
  <div id="tabs"></div>
</div>
<div id="intro"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast"></div>

function newGame(diff, shopName, owner) {
  var d = DIFF[diff]; var S = { v: 1, diff: diff, day: 1, cash: d.cash, rep: 30, owner: owner || "Patron", name: shopName || "Chez Birame", shops: [], stock: {}, prices: {}, idx: {}, sup: { A: 0, B: 0, C: 0 }, loan: 0, loanDay: 0, ad: { days: 0, boost: 0 }, hist: [], evs: [], log: [], ach: {}, weekRev: 0, weekProf: 0, win: false, broke: 0, stats: { cust: 0, sold: 0, best: 0 }, tutor: 0, news: [], daySeed: 0 };
  S.shops.push(mkShop("sandaga", S.name)); PRODS.forEach(function (p) { S.stock[p.id] = []; S.prices[p.id] = Math.round(p.price * 1.08 / 10) * 10; S.idx[p.id] = 1; });

}
function mkShop(q, name) { return { q: q, name: name, tier: 0, up: {}, staff: [], col: "#e0b43c", awn: "#c62828", theme: 0, open: true }; }
function qOf(id) { return QUART.filter(function (q) { return q.id === id; })[0]; }
