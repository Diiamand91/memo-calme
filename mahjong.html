 facile:{name:"Facile",desc:"62 tuiles",build:function(){var t=[];grid(t,0,8,5,0,0);grid(t,1,6,3,1,1);grid(t,2,4,1,2,2);return t}},

 tortue:{name:"Tortue",desc:"144 tuiles · classique",build:function(){var t=[],i,rows=[[0,12,2],[2,8,6],[4,10,4],[6,12,2],[8,12,2],[10,10,4],[12,8,6],[14,12,2]];

};

 for(i=0;i<n;i++)for(j=0;j<n;j++){if(i===j)continue;var dz=T[j].z-T[i].z,dx=T[j].x-T[i].x,dy=T[j].y-T[i].y;

function mk(f){return f<34?f:(f<38?34:38)}

function assign(T,idx,pairs){for(var at=0;at<400;at++){var al=new Uint8Array(T.length),i;idx.forEach(function(q){al[q]=1});

   if(fr.length<2){ok=false;break}
   var a=fr[Math.floor(Math.random()*fr.length)],b;do{b=fr[Math.floor(Math.random()*fr.length)]}while(b===a);
   var pr=order[pi++];if(Math.random()<.5)pr=[pr[1],pr[0]];res[a]=pr[0];res[b]=pr[1];al[a]=0;al[b]=0;rem-=2}
  if(ok)return res}return null}
/* ================= état ================= */
var T=[],S=[],G={lay:"tortue",t:0,moves:0,hints:0,shuffles:0,undo:[],sel:-1,state:"menu",hintP:null,hintT:0},ORDER=[],PART=[];
function isFree(i){var al=new Uint8Array(S.length);for(var k=0;k<S.length;k++)al[k]=S[k].alive?1:0;return !!al[i]&&isFreeAl(T,al,i)}
function freeList(){var al=new Uint8Array(S.length),k,r=[];for(k=0;k<S.length;k++)al[k]=S[k].alive?1:0;for(k=0;k<S.length;k++)if(al[k]&&isFreeAl(T,al,k))r.push(k);return r}
function movesAvail(){var fr=freeList(),m={},out=[];fr.forEach(function(i){var key=mk(S[i].f);(m[key]=m[key]||[]).push(i)});
 for(var k in m)if(m[k].length>=2)for(var a=0;a<m[k].length;a++)for(var b=a+1;b<m[k].length;b++)out.push([m[k][a],m[k][b]]);return out}
function alive(){var n=0;S.forEach(function(s){if(s.alive)n++});return n}
function newGame(key,resume){G.lay=key;T=LAY[key].build();prep(T);var idx=T.map(function(_,i){return i}),n=T.length,pairs=shuf(fullPairs()).slice(0,n/2),res=assign(T,idx,pairs);
 S=T.map(function(_,i){return{f:res[i],alive:true,an:null}});G.t=0;G.moves=0;G.hints=0;G.shuffles=0;G.undo=[];G.sel=-1;G.hintP=null;G.state="play";PART=[];ST.played++;lss(STK,ST);
 fit();intro();save()}
function save(){if(G.state!=="play")return;lss(LSK,{lay:G.lay,f:S.map(function(s){return s.f}),a:S.map(function(s){return s.alive?1:0}),t:G.t,m:G.moves,h:G.hints,s:G.shuffles,u:G.undo})}
function load(){var d=lsg(LSK,null);if(!d||!LAY[d.lay])return false;T=LAY[d.lay].build();prep(T);if(d.f.length!==T.length)return false;
 S=T.map(function(_,i){return{f:d.f[i],alive:!!d.a[i],an:null}});G.lay=d.lay;G.t=d.t;G.moves=d.m;G.hints=d.h||0;G.shuffles=d.s||0;G.undo=d.u||[];G.sel=-1;G.hintP=null;G.state="play";PART=[];fit();return alive()>0}
function clearSave(){try{localStorage.removeItem(LSK)}catch(e){}}
/* ================= géométrie ================= */
var cv=$("cv"),cx=cv.getContext("2d"),dpr=1,CW=0,CH=0,TW=40,TH=52,D=5,FW=39,FH=51,PAD=14,ROT=false,SPR={},BG=null,RAD=5;
function fit(){if(!T.length||!CW)return;var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,maxz=0;
 T.forEach(function(t){minx=Math.min(minx,t.x);maxx=Math.max(maxx,t.x);miny=Math.min(miny,t.y);maxy=Math.max(maxy,t.y);maxz=Math.max(maxz,t.z)});
 var padx=10,pady=10,best=0,bestRot=false;
 [false,true].forEach(function(rot){var wu=(rot?maxy-miny:maxx-minx)+2,hu=(rot?maxx-minx:maxy-miny)+2,k=(maxz+1)*.11;
  var tw=Math.min((CW-padx*2)/(wu/2+k),(CH-pady*2)/(hu/2*1.3+k*1.3*.9),66);if(tw>best+.01){best=tw;bestRot=rot}});
 ROT=bestRot;TW=Math.floor(best*2)/2;TH=TW*1.3;D=Math.max(3,TW*.11);FW=TW-1.2;FH=TH-1.2;RAD=TW*.12;
 var wu2=(ROT?maxy-miny:maxx-minx)+2,hu2=(ROT?maxx-minx:maxy-miny)+2,totW=wu2/2*TW+(maxz+1)*D,totH=hu2/2*TH+(maxz+1)*D;
 var ox=(CW-totW)/2+maxz*D,oy=(CH-totH)/2+maxz*D;
 T.forEach(function(t){var ux=(ROT?t.y-miny:t.x-minx),uy=(ROT?t.x-minx:t.y-miny);t.px=ox+ux/2*TW-t.z*D;t.py=oy+uy/2*TH-t.z*D;t.ux=ux;t.uy=uy});
 ORDER=T.map(function(_,i){return i}).sort(function(a,b){var A=T[a],B=T[b];return A.z-B.z||A.uy-B.uy||A.ux-B.ux});
 SPR={};buildBG()}
function resize(){var w=$("cvw");if(!w)return;dpr=Math.min(window.devicePixelRatio||1,3);CW=w.clientWidth;CH=w.clientHeight;cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);fit();need=true}
/* ================= fond de table ================= */
function buildBG(){var c=document.createElement("canvas");c.width=Math.round(CW*dpr);c.height=Math.round(CH*dpr);var x=c.getContext("2d");x.scale(dpr,dpr);var th=CFG.table,g;
 if(th===0){g=x.createRadialGradient(CW/2,CH*.45,10,CW/2,CH*.5,Math.max(CW,CH)*.75);g.addColorStop(0,"#24795a");g.addColorStop(.6,"#135238");g.addColorStop(1,"#082a1b");x.fillStyle=g;x.fillRect(0,0,CW,CH);
  for(var i=0;i<Math.floor(CW*CH/18);i++){x.fillStyle="rgba("+(Math.random()<.5?"255,255,255":"0,0,0")+","+(Math.random()*.06)+")";x.fillRect(Math.random()*CW,Math.random()*CH,1,1)}}
 else if(th===1){g=x.createLinearGradient(0,0,CW,CH);g.addColorStop(0,"#8a5a30");g.addColorStop(.5,"#6b4120");g.addColorStop(1,"#4a2b14");x.fillStyle=g;x.fillRect(0,0,CW,CH);
  for(var y=0;y<CH;y+=2){x.strokeStyle="rgba("+(Math.random()<.5?"30,12,0":"255,214,150")+","+(.04+Math.random()*.07)+")";x.lineWidth=.6+Math.random()*1.6;x.beginPath();var yy=y+Math.sin(y*.05)*2;x.moveTo(0,yy);for(var xx=0;xx<=CW;xx+=40)x.lineTo(xx,yy+Math.sin(xx*.012+y*.2)*2.2);x.stroke()}
  for(var p=0;p<5;p++){x.strokeStyle="rgba(20,8,0,.25)";x.lineWidth=2;x.beginPath();var py=CH*(p+1)/6;x.moveTo(0,py);x.lineTo(CW,py);x.stroke()}}
 else{g=x.createRadialGradient(CW/2,CH*.4,10,CW/2,CH*.5,Math.max(CW,CH)*.8);g.addColorStop(0,"#2c4678");g.addColorStop(.6,"#15244a");g.addColorStop(1,"#070d20");x.fillStyle=g;x.fillRect(0,0,CW,CH);
  for(var s=0;s<70;s++){x.fillStyle="rgba(255,255,255,"+(.1+Math.random()*.4)+")";x.fillRect(Math.random()*CW,Math.random()*CH,1.2,1.2)}}
 g=x.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*.4,CW/2,CH/2,Math.max(CW,CH)*.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.45)");x.fillStyle=g;x.fillRect(0,0,CW,CH);BG=c}
/* ================= dessin des tuiles ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
var FONT='"Kaiti SC","STKaiti","Songti SC","PingFang SC","Noto Serif CJK SC","Noto Serif CJK JP","SimSun",serif';
var PAL={g:["#0b5f30","#3fbf73"],r:["#8c1a12","#e55a40"],b:["#0f3c84","#5598e8"]};
function dot(c,x,y,r,p){var gr=c.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,p[1]);gr.addColorStop(1,p[0]);c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill();
 c.strokeStyle="#fbf6e2";c.lineWidth=r*.12;c.beginPath();c.arc(x,y,r*.72,0,7);c.stroke();c.fillStyle=p[0];c.beginPath();c.arc(x,y,r*.46,0,7);c.fill();
 c.fillStyle="#fbf6e2";for(var i=0;i<6;i++){var a=i*Math.PI/3;c.beginPath();c.arc(x+Math.cos(a)*r*.27,y+Math.sin(a)*r*.27,r*.07,0,7);c.fill()}c.fillStyle=p[1];c.beginPath();c.arc(x,y,r*.1,0,7);c.fill()}

function bird(c,x,y,W,H){var s=Math.min(W,H);c.save();c.translate(x,y);
 [["#c4271d",-.7],["#1b4f9c",-.35],["#0b5f30",0]].forEach(function(f){c.save();c.rotate(f[1]*.8+.5);c.fillStyle=f[0];c.beginPath();c.ellipse(-s*.12,s*.32,s*.075,s*.27,.3,0,7);c.fill();c.restore()});
 var gr=c.createLinearGradient(0,-s*.3,0,s*.2);gr.addColorStop(0,"#52c47a");gr.addColorStop(1,"#0b5f30");c.fillStyle=gr;c.beginPath();c.ellipse(0,s*.02,s*.24,s*.2,-.2,0,7);c.fill();
