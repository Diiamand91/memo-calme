 s.rm.forEach(function(i){if(!S.rooms.some(function(c){return c.i===i})){var t=RPOS[i];S.rooms.push({i:i,x:t.x,y:t.y,sx:t.sx,lane:t.lane,left:t.left,occ:null,t:0,res:null,dirty:0,cl:0,pop:1})}});
